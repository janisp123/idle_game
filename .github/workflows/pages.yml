name: Idle Game website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_arena_only.mjs"
      - "tools/test_group_endgame.mjs"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - "tools/browser-smoke.mjs"
      - "tools/test_combat_art.mjs"
      - "tools/combat-simulator.mjs"
      - "tools/test_combat_simulator.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/website-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/website-validation.yml

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "./site"
      # GitHub Pages can briefly fail to discover a just-uploaded artifact.
      # Give the Actions artifact index time to become visible before deployment.
      # If a run fails, start a NEW run; rerunning upload can create duplicate
      # github-pages artifacts under the same run ID (incident 44891200055).
      - name: Allow Pages artifact indexing
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-release:
    name: Notify owner of published game
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: release-notice-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Post one completion mention on exact merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OWNER" =~ ^[A-Za-z0-9-]+$ && "$GITHUB_REPOSITORY" == "$OWNER/"* ]]
          # Only a PR whose actual merge commit is this deployed revision qualifies.
          pulls=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls")
          numbers=$(jq -c --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '[.[][] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .base.repo.full_name == $repo) | .number] | unique' <<< "$pulls")
          count=$(jq 'length' <<< "$numbers")
          if [[ "$count" == 0 ]]; then
            echo "No exact merged pull request; no notice."
            exit 0
          fi
          [[ "$count" == 1 ]] || { echo "Ambiguous merged pull request; no notice."; exit 1; }
          number=$(jq -r '.[0]' <<< "$numbers")
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          marker="<!-- published-game:$RELEASE_SHA -->"
          comments=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$number/comments")
          # Only our bot's exact marker counts; arbitrary external comments cannot spoof it.
          duplicate=$(jq -c --arg marker "$marker" 'if type != "array" or any(.[]; type != "array") then error("Invalid comment pages") else any(.[][]; .user.login == "github-actions[bot]" and ((.body // "") | split("\n")[0]) == $marker) end' <<< "$comments")
          [[ "$duplicate" == true || "$duplicate" == false ]]
          if [[ "$duplicate" == true ]]; then
            echo "Release notice already exists."
            exit 0
          fi
          body=$(printf '%s\n@%s Game update merged and deployed successfully.\n\nRevision: %s\nPlay: https://%s.github.io/%s/play/?v=%s\nDeployment: %s/%s/actions/runs/%s' "$marker" "$OWNER" "$RELEASE_SHA" "$OWNER" "${GITHUB_REPOSITORY#*/}" "${RELEASE_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" --jq .html_url
