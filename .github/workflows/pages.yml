name: Idle Game website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_arena_only.mjs"
      - "tools/test_group_endgame.mjs"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - "tools/browser-smoke.mjs"
      - "tools/test_combat_art.mjs"
      - "tools/combat-simulator.mjs"
      - "tools/test_combat_simulator.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_arena_only.mjs"
      - "tools/test_group_endgame.mjs"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - "tools/browser-smoke.mjs"
      - "tools/test_combat_art.mjs"
      - "tools/combat-simulator.mjs"
      - "tools/test_combat_simulator.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check site structure and local links
        run: python tools/check_pages_site.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check game module syntax
        run: node --check site/play/arena-presentation.mjs && node --check site/play/arena-view.mjs && node --check site/play/manager-app.mjs && node --check site/play/manager-migration.mjs && node --check site/play/app.mjs && node --check site/play/engine.mjs && node --check site/play/loot.mjs && node --check site/play/production.mjs && node --check site/play/attributes.mjs && node --check site/play/combat.mjs && node --check site/play/combat-skills.mjs && node --check site/play/combat-art.mjs && node --check tools/combat-simulator.mjs && node --check tools/test_combat_simulator.mjs
      - name: Test offline engine, skill migration and browser UI
        run: node --test tools/test_arena_only.mjs tools/test_group_endgame.mjs tools/test_group_rank.mjs tools/test_group_manager.mjs tools/test_group_timeline.mjs tools/test_group_combat.mjs tools/test_battle_group.mjs tools/test_clone_opponents.mjs tools/test_battle_analytics.mjs tools/test_arena_speed.mjs tools/test_arena_presentation.mjs tools/test_manager_migration.mjs tools/test_game_engine.mjs tools/test_physical_duel.mjs tools/test_arenas.mjs tools/test_game_ui.mjs tools/test_combat.mjs tools/test_combat_art.mjs tools/test_combat_simulator.mjs
      - name: Real Chromium browser smoke (mobile and desktop)
        run: node tools/browser-smoke.mjs
      - name: Attach browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-smoke-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "./site"
      # GitHub Pages can briefly fail to discover a just-uploaded artifact.
      # Give the Actions artifact index time to become visible before deployment.
      # If a run fails, start a NEW run; rerunning upload can create duplicate
      # github-pages artifacts under the same run ID (incident 44891200055).
      - name: Allow Pages artifact indexing
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
