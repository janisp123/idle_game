name: Idle Game website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check site structure and local links
        run: python tools/check_pages_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check game module syntax
        run: node --check site/play/app.mjs && node --check site/play/engine.mjs && node --check site/play/loot.mjs
      - name: Test offline engine, skill migration and browser UI
        run: node --test tools/test_game_engine.mjs tools/test_game_ui.mjs

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
