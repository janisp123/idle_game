name: Idle Game website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/check_pages_site.py"
      - "tools/test_arena_only.mjs"
      - "tools/test_group_endgame.mjs"
      - "tools/test_game_engine.mjs"
      - "tools/test_game_ui.mjs"
      - "tools/browser-smoke.mjs"
      - "tools/test_combat_art.mjs"
      - "tools/combat-simulator.mjs"
      - "tools/test_combat_simulator.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/website-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/website-validation.yml

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "./site"
      # GitHub Pages can briefly fail to discover a just-uploaded artifact.
      # Give the Actions artifact index time to become visible before deployment.
      # If a run fails, start a NEW run; rerunning upload can create duplicate
      # github-pages artifacts under the same run ID (incident 44891200055).
      - name: Allow Pages artifact indexing
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
