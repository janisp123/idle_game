name: Stabilization baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/stabilization-baseline.mjs'
      - '.github/workflows/stabilization-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Capture deterministic synthetic baseline and tracked inventory
        run: node tools/stabilization-baseline.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stabilization-baseline
          path: stabilization-baseline.json
          if-no-files-found: error
          retention-days: 30
