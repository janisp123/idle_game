name: Developer Game Systems Lab

on:
  workflow_dispatch:
    inputs:
      full_balance:
        description: 'Run the full six-month progression and paired combat balance reports'
        type: boolean
        required: false
        default: false
      scenario:
        description: 'Public test scenario JSON; default runs all modules. Never paste a real save.'
        type: string
        required: false
        default: '{"module":"loot","activity":"mining","level":25,"units":100,"trials":10000}'
  pull_request:
    branches: [main]
    paths:
      - 'site/play/**/*.mjs'
      - '!site/play/app.mjs'
      - '!site/play/character-stats.mjs'
      - '!site/play/result-readout.mjs'
      - 'tools/system-lab.mjs'
      - 'tools/combat-simulator.mjs'
      - 'tools/test_combat_simulator.mjs'
      - 'tools/simulation/**'
      - 'tools/test_system_lab.mjs'
      - 'docs/mechanics/SYSTEM_LAB.md'
      - 'docs/mechanics/README.md'
      - 'docs/mechanics/CHANGING_BALANCE.md'
      - 'docs/mechanics/COMBAT_SIMULATOR.md'
      - 'AGENTS.md'
      - 'docs/DECISIONS.md'
      - 'docs/CHANGELOG.md'
      - 'docs/WORK_CHECKPOINT.md'
      - '.github/workflows/system-lab.yml'

permissions:
  contents: read

jobs:
  system-lab:
    name: Verify real game system simulations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run complete isolated production-parity tests
        run: |
          node --check tools/system-lab.mjs
          node --test tools/test_system_lab.mjs
      - name: Validate scenario input without accepting private saves
        env:
          SCENARIO_INPUT: ${{ inputs.scenario || '{"scenarios":[{"module":"loot","activity":"mining","level":25,"units":100,"trials":250},{"module":"crafting","activity":"construction","level":10,"workCycles":100,"inventory":{"limestone":100,"fuel":70},"trials":250}]}' }}
        run: |
          node --input-type=module -e '
            import { writeFileSync,readFileSync } from "node:fs";
            const raw=process.env.SCENARIO_INPUT;
            if(raw.length>30000)throw new Error("Scenario too long");
            const value=JSON.parse(raw);
            const check=(v,depth=0)=>{
              if(depth>20)throw new Error("Scenario too deep");
              if(v===null||typeof v!=="object")return;
              if(Array.isArray(v)){if(v.length>100)throw new Error("Array too long");for(const x of v)check(x,depth+1);return;}
              for(const [key,child] of Object.entries(v)){
                if(["snapshot","state","combatSession","player","secret","token"].includes(key))
                  throw new Error("No private player saves or credentials in public Actions");
                check(child,depth+1);
              }
            };
            check(value);
            writeFileSync("system-lab-scenario.json",JSON.stringify(value),"utf8");
          '
      - name: Generate immutable system report from actual game modules
        run: |
          node tools/system-lab.mjs --config system-lab-scenario.json > system-lab-report.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r=JSON.parse(readFileSync("system-lab-report.json","utf8"));
            console.log("System lab report:",r.reportType);
            console.log("Modules:",(r.results??r.scenarios??[]).map(x=>x.module||"combat").join(", "));
            console.log("Valid JSON; full report attached below.");
          '
      - name: Produce full normal/alpha build progression report
        if: github.event_name == 'workflow_dispatch' && inputs.full_balance == true
        run: |
          node tools/simulation/build-progression.mjs > build-progression-report.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report=JSON.parse(readFileSync("build-progression-report.json","utf8"));
            for(const p of report.reports)for(const s of p.scenarios)
              console.log(JSON.stringify({profile:p.profile, ...s}));
          '
      - name: Run full paired-build and economy audit
        if: github.event_name == 'workflow_dispatch' && inputs.full_balance == true
        run: |
          node tools/simulation/balance-audit.mjs > balance-audit.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("balance-audit.json","utf8"));
            console.log(JSON.stringify({audit:"bounds",...r.bounds}));
            for(const row of r.rows)console.log(JSON.stringify({audit:"combat",...row}));
            for(const {checkpoints,...row} of r.economy)console.log(JSON.stringify({audit:"economy",...row}));
          '
      - name: Attach balance audit
        if: github.event_name == 'workflow_dispatch' && inputs.full_balance == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balance-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: balance-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Attach build progression baseline
        if: github.event_name == 'workflow_dispatch' && inputs.full_balance == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-progression-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-progression-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Attach report, without modifying playable site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: system-lab-report.json
          if-no-files-found: error
          retention-days: 7
