name: Endgame meta and counter audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/team-behaviour-audit.mjs'
      - 'tools/team-behaviour-refine.mjs'
      - 'tools/individual-behaviour-audit.mjs'
      - 'tools/offline-behaviour-audit.mjs'
      - 'tools/armour-durability-audit.mjs'
      - 'tools/armour-wear-audit.mjs'
      - 'tools/endgame-meta-audit.mjs'
      - '.github/workflows/team-behaviour.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [max,near,common]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare S-grade max-stat builds and exhaustive elite counter search
        env:
          PROFILE: ${{ matrix.profile }}
        run: node tools/endgame-meta-audit.mjs "$PROFILE" > behaviour.json
      - name: Print verified summary
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const {screened,validated,...r}=JSON.parse(readFileSync("behaviour.json","utf8"));
            for(const t of r.finalists)delete t.byEnemy;
            console.log("TEAM_ENDGAME "+JSON.stringify(r));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endgame-meta-${{ matrix.profile }}
          path: behaviour.json
          retention-days: 7
