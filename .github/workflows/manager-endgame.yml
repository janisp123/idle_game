name: Manager endgame validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/play/**/*.mjs'
      - 'tools/manager-endgame-validation.mjs'
      - '.github/workflows/manager-endgame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Max-only sensitivity and broad holdouts
        run: |
          node tools/manager-endgame-validation.mjs > manager-endgame.json
          node --input-type=module -e 'import {readFileSync} from "node:fs";const r=JSON.parse(readFileSync("manager-endgame.json"));for(const v of Object.values(r.broad))delete v.rows;console.log(JSON.stringify(r));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manager-endgame-validation
          path: manager-endgame.json
          if-no-files-found: error
